name: esp32shell-ci

on:
  push:
  pull_request:

jobs:
  host-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python tools/validate_partitions.py

  arduino-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli config init --overwrite
      - run: arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli core update-index
      - run: arduino-cli core install esp32:esp32@3.3.11
      - run: >-
          arduino-cli compile
          --fqbn esp32:esp32:esp32s3
          --board-options FlashSize=32M,PSRAM=opi
          --build-path .build/arduino
          --warnings all
          firmware/arduino/esp32shell
      - run: test -f .build/arduino/esp32shell.ino.elf && test -f .build/arduino/esp32shell.ino.map && test -f .build/arduino/flash_args
